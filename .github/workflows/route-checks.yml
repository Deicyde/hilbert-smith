# The route-separation checks of PLAN section 5 that need no Lean build: the import boundary of
# the library HilbertSmith, its coverage by src/HilbertSmith.lean, pin equality with HS_proof, no
# copying of HS_proof's files, and the paper's import boundary and clean-room checks. The checks
# that need the build (the purity audit and its tests) run inside `lake build`, in
# autoform-verify.yml.

name: route checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: route-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route-checks:
    name: route checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the route checks
        run: python3 scripts/route_checks.py
